spring.application.name=sesiones_backend
server.port=8082

# Configuración MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sesion_academica?useSSL=false&serverTimezone=UTC&nullDatabaseMeansCurrent=true&useInformationSchema=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_catalog=sesion_academica

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
