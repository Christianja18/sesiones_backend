spring.application.name=sesiones_backend
server.port=8082
spring.config.import=optional:file:.env[.properties]

# Configuracion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sesion_academica?useSSL=false&serverTimezone=UTC&nullDatabaseMeansCurrent=true&useInformationSchema=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_catalog=sesion_academica

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# DeepSeek
app.llm.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.llm.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.llm.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
app.llm.deepseek.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:180}
app.llm.deepseek.max-retries=${DEEPSEEK_MAX_RETRIES:2}
app.llm.deepseek.retry-delay-ms=${DEEPSEEK_RETRY_DELAY_MS:2000}
app.curriculo.documento.timeout-seconds=${CURRICULO_DOCUMENTO_TIMEOUT_SECONDS:60}
app.curriculo.chunk.max-chars=${CURRICULO_CHUNK_MAX_CHARS:2500}
app.curriculo.chunk.max-paragraphs=${CURRICULO_CHUNK_MAX_PARAGRAPHS:5}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# LLM / DeepSeek
llm.base-url=${LLM_BASE_URL:https://api.deepseek.com}
llm.api-key=${DEEPSEEK_API_KEY:}
llm.model=${LLM_MODEL:deepseek-chat}
llm.timeout-seconds=${LLM_TIMEOUT:30}
